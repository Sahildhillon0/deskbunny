version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["tauri*", "tauri-*"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["tauri*", "tauri-*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # svelte-check 4 supports TypeScript 5 and 6 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@tauri-apps/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
