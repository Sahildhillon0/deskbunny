name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  engine:
    name: engine (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Host tests
        run: |
          test -f engine/Makefile || { echo "::error file=engine/Makefile::engine/Makefile is missing; 'make -C engine test' is the engine test entry point"; exit 1; }
          make -C engine test CC=${{ matrix.cc }}

  firmware:
    uses: ./.github/workflows/firmware.yml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # tauri.conf.json bundles ../../firmware/dist/* as resources; the glob must resolve to compile.
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist

      - uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # generate_context! needs frontendDist (app/dist) to exist.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  bundle:
    name: bundle (${{ matrix.name }})
    needs: [firmware, rust, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04 # oldest supported glibc for the AppImage/deb
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: bundle-${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      # No tagName/releaseId: build only, no GitHub release. Bundles are unsigned here.
      # Windows: default MSI + NSIS only; custom WiX fragments referencing resources trip ICE69.
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: app
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v7
        with:
          name: deskbunny-${{ matrix.name }}
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7
