# Reusable: build every board image with arduino-cli and publish firmware/dist
# as the `firmware-dist` artifact. Called by ci.yml and release.yml.
name: Firmware

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.x

      # Cores are installed by build.sh (arduino:avr, arduino:renesas_uno,
      # esp32:esp32); cache them. The esp32 core is ~6 GB installed, so it gets
      # its own cache keyed on the version pinned in build.sh, and the download
      # staging directory is never cached.
      - name: ESP32 core version
        id: esp32
        run: |
          v="$(sed -n 's/^ESP32_CORE_VERSION="\${ESP32_CORE_VERSION:-\([0-9.]*\)}"$/\1/p' firmware/build.sh)"
          test -n "$v" || { echo "::error::ESP32_CORE_VERSION not found in firmware/build.sh"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/packages/esp32
            !~/.arduino15/staging
          key: arduino15-${{ runner.os }}-${{ hashFiles('firmware/boards.json', 'firmware/build.sh') }}
          restore-keys: arduino15-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.arduino15/packages/esp32
          key: arduino-esp32-${{ runner.os }}-${{ steps.esp32.outputs.version }}

      - name: Host tests (nixxa protocol core)
        run: make -C firmware/nixxa_esp32/tests

      - name: Build firmware images
        run: |
          bash firmware/build.sh
          rm -rf ~/.arduino15/staging # downloaded archives: not needed once installed

      - name: Size report
        run: |
          test -f firmware/dist/manifest.json || { echo "::error::firmware/dist/manifest.json was not produced"; exit 1; }
          ls -l firmware/dist
          {
            echo "### Firmware images (fwVersion $(jq -r .fwVersion firmware/dist/manifest.json))"
            echo
            echo "| file | format | chip | bytes | blobOffset | sha256 |"
            echo "|---|---|---|---:|---:|---|"
            jq -r '.images[] | [.file, .format, (.chip // "-"), (.blobOffset|tostring), .sha256] | @tsv' firmware/dist/manifest.json |
              while IFS=$'\t' read -r file fmt chip off sha; do
                echo "| $file | $fmt | $chip | $(stat -c %s "firmware/dist/$file") | $off | \`${sha:0:16}…\` |"
              done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-dist
          path: firmware/dist/
          if-no-files-found: error
          retention-days: 3
