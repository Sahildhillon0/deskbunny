name: Mobile

# Flutter app (mobile/): Dart, Kotlin and Swift. The macOS job is the only
# place the iOS Swift link compiles (ARCHITECTURE.md "iOS (phase 3)" > CI).
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "engine/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "engine/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  android:
    name: flutter + android (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Engine copies are current
        run: tool/sync_engine.sh --check
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: nixxa_engine plugin tests
        working-directory: mobile/packages/nixxa_engine
        run: |
          flutter pub get
          flutter test
      # Before the Gradle step: it writes android/local.properties (flutter.sdk).
      - run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  ios:
    name: ios (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build for device (no signing)
        run: flutter build ios --debug --no-codesign
      - name: Swift unit tests (RunnerTests, simulator)
        run: |
          flutter build ios --simulator --debug
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for rt in sorted(d, reverse=True) if ".iOS-" in rt for x in d[rt] if x["name"].startswith("iPhone")))
          ')
          echo "simulator $udid"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$udid" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO
