# Publishes a GitHub release with installers for all three OSes plus the raw
# firmware images, so users can download straight from the Releases page.
#
# Runs every time CI finishes green on main, and every run ships a new version:
# the patch number goes up by one (0.1.0 -> 0.1.1). Put [minor] or [major] in
# the commit message's first line (or pick it when running by hand) for 0.2.0 / 1.0.0, and
# [skip release] to not release that push. A version already set higher by
# scripts/bump-version.sh wins. The bump is committed back to main as
# "release: vX.Y.Z". See docs/RELEASING.md.
#
# The release stays a draft until every installer and firmware file is
# attached, then is published as Latest, so a failed build never goes public.
# Installers carry updater signatures and latest.json, which the app's
# "Check for updates" reads.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

# One release run at a time; a later run waits and then bumps from this release.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  preflight:
    # Only green CI runs of pushes (not pull requests) release.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version bump, creates the draft release
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Pick the version and commit the bump
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "$EVENT" = workflow_run ] && [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::notice::main has moved past $HEAD_SHA; the newer commit's CI run releases it."
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          level=${INPUT_BUMP:-patch}
          # Only the subject line counts, so a body that mentions the markers doesn't trigger them.
          subject=${MESSAGE%%$'\n'*}
          case "$subject" in
            *"[skip release]"*) echo "::notice::[skip release] in the commit message."
                                echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *"[major]"*) level=major ;;
            *"[minor]"*) level=minor ;;
          esac

          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          latest=${latest#v}
          [ -n "$latest" ] || latest=0.0.0
          IFS=. read -r major minor patch <<< "$latest"
          case "$level" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *)     next="$major.$minor.$((patch + 1))" ;;
          esac
          # A version already raised by hand (or by a failed earlier run) is kept.
          version=$(printf '%s\n%s\n' "$next" "$conf" | sort -V | tail -n1)
          echo "latest release $latest, $level bump -> $next, source says $conf: releasing $version"

          if [ "$version" != "$conf" ]; then
            scripts/bump-version.sh "$version"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "release: v$version [skip ci]"
            git push origin HEAD:main
          fi

          pkg=$(jq -r .version app/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fw=$(sed -n 's/^#define DB_FW_VERSION "\(.*\)"/\1/p' firmware/deskbunny/deskbunny.ino)
          for v in "$pkg" "$cargo" "$fw"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Version numbers disagree (package.json $pkg, Cargo.toml $cargo, firmware $fw). Run scripts/bump-version.sh $version and push again."; exit 1
            fi
          done
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reuses the draft a failed earlier run left behind for the same version.
      - name: Create the draft release
        id: draft
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          body=$(cat <<EOF
          ## Download

          | System | File |
          |---|---|
          | Windows | \`DeskBunny_*_x64-setup.exe\` or \`.msi\` |
          | macOS (Apple silicon and Intel) | \`DeskBunny_*_universal.dmg\` |
          | Linux | \`.AppImage\`, \`.deb\` or \`.rpm\` |

          DeskBunny walks you through setup on first launch. The same steps are in
          [docs/SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/SETUP.md).

          The builds are not code-signed yet. On Windows, click **More info > Run anyway**.
          On macOS, right-click the app and choose **Open** the first time.

          The \`.hex\`/\`.bin\` firmware images and \`manifest.json\` are for flashing by hand;
          the app already includes them.
          EOF
          )
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f name="DeskBunny $TAG" \
              -f body="$body" -F draft=true -q .id)
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
              -f target_commitish="$SHA" -f body="$body" > /dev/null
          fi
          echo "Draft release $TAG: id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  firmware:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build:
    name: build (${{ matrix.name }})
    needs: [preflight, firmware]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      # Signing is optional. Only secrets that are actually set are exported, because
      # tauri treats a present-but-empty APPLE_CERTIFICATE / APPLE_ID as "sign/notarize
      # with this" and fails. With no secrets the build succeeds unsigned:
      #  - macOS: unsigned .app/.dmg must be opened with right-click > Open the first
      #    time (Gatekeeper), or `xattr -dr com.apple.quarantine DeskBunny.app`.
      #  - Windows: SmartScreen shows "unknown publisher".
      #  - Updater: no .sig files or latest.json unless TAURI_SIGNING_PRIVATE_KEY is set,
      #    so the in-app update check finds nothing for that release.
      - name: Export signing secrets that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          vars=(TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "$RUNNER_OS" = macOS ]; then
            vars+=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          fi
          for v in "${vars[@]}"; do
            if [ -n "${!v}" ]; then
              eof="EOF_$(openssl rand -hex 8)"
              { echo "$v<<$eof"; printf '%s\n' "${!v}"; echo "$eof"; } >> "$GITHUB_ENV"
              echo "$v: set"
            else
              echo "$v: not set"
            fi
          done
          # Updater bundles (.sig, .app.tar.gz, latest.json) need the key; tauri.conf.json
          # leaves them off so CI and local builds work without it.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'TAURI_CONFIG={"bundle":{"createUpdaterArtifacts":true}}' >> "$GITHUB_ENV"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this release cannot be installed from the app's update button."
          fi

      # Windows Authenticode: import a base64 .pfx into the user store and point tauri
      # at it with a --config overlay. Skipped (unsigned build) when the secret is empty.
      - name: Import Windows signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "WINDOWS_CERTIFICATE not set: building unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = (Join-Path $env:RUNNER_TEMP "tauri.sign.json") -replace '\\', '/'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8
          "args=--config $conf" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.args }}
          releaseId: ${{ needs.preflight.outputs.release_id }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist
      - name: Attach firmware images
        run: |
          shopt -s nullglob
          files=(firmware/dist/*.hex firmware/dist/*.bin firmware/dist/manifest.json)
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      # Publishing creates the tag on the released commit if it doesn't exist yet.
      - name: Publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -X PATCH \
            -F draft=false -f make_latest=true -q .html_url
