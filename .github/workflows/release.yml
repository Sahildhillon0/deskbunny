# Publishes a GitHub release with installers for all three OSes plus the raw
# firmware images, so users can download straight from the Releases page.
#
# Runs on every push to main, but only releases when the app version
# (app/src-tauri/tauri.conf.json) has no published release yet: bump the
# version with scripts/bump-version.sh and push to ship a new one. Pushing a
# vX.Y.Z tag or running it by hand works too. See docs/RELEASING.md.
#
# The release stays a draft until every installer and firmware file is
# attached, then is published as Latest, so a failed build never goes public.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to release (defaults to the selected branch)
        required: false
        type: string

permissions:
  contents: read

# One release run at a time; a later push waits and then sees the release exists.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft release
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version app/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          fw=$(sed -n 's/^#define DB_FW_VERSION "\(.*\)"/\1/p' firmware/deskbunny/deskbunny.ino)
          echo "tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo firmware=$fw"
          for v in "$pkg" "$cargo" "$fw"; do
            if [ "$v" != "$conf" ]; then
              echo "::error::Version numbers disagree. Run scripts/bump-version.sh $conf and push again."; exit 1
            fi
          done
          tag="v$conf"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo "::error::Tag $REF_NAME does not match the app version $conf."; exit 1
          fi
          published=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id")
          if [ -n "$published" ]; then
            echo "::notice::$tag is already released. Bump the version (scripts/bump-version.sh) to release again."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reuses the draft a failed earlier run left behind for the same version.
      - name: Create the draft release
        id: draft
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
        run: |
          body=$(cat <<EOF
          ## Download

          | System | File |
          |---|---|
          | Windows | \`DeskBunny_*_x64-setup.exe\` or \`.msi\` |
          | macOS (Apple silicon and Intel) | \`DeskBunny_*_universal.dmg\` |
          | Linux | \`.AppImage\`, \`.deb\` or \`.rpm\` |

          DeskBunny walks you through setup on first launch. The same steps are in
          [docs/SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/SETUP.md).

          The builds are not code-signed yet. On Windows, click **More info > Run anyway**.
          On macOS, right-click the app and choose **Open** the first time.

          The \`.hex\`/\`.bin\` firmware images and \`manifest.json\` are for flashing by hand;
          the app already includes them.
          EOF
          )
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q ".[] | select(.tag_name == \"$TAG\" and .draft) | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$SHA" -f name="DeskBunny $TAG" \
              -f body="$body" -F draft=true -q .id)
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
              -f target_commitish="$SHA" -f body="$body" > /dev/null
          fi
          echo "Draft release $TAG: id $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  firmware:
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    uses: ./.github/workflows/firmware.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build:
    name: build (${{ matrix.name }})
    needs: [preflight, firmware]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: windows
            os: windows-latest
            args: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci

      # Signing is optional. Only secrets that are actually set are exported, because
      # tauri treats a present-but-empty APPLE_CERTIFICATE / APPLE_ID as "sign/notarize
      # with this" and fails. With no secrets the build succeeds unsigned:
      #  - macOS: unsigned .app/.dmg must be opened with right-click > Open the first
      #    time (Gatekeeper), or `xattr -dr com.apple.quarantine DeskBunny.app`.
      #  - Windows: SmartScreen shows "unknown publisher".
      #  - Updater: no .sig files unless TAURI_SIGNING_PRIVATE_KEY is set.
      - name: Export signing secrets that are set
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          vars=(TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "$RUNNER_OS" = macOS ]; then
            vars+=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          fi
          for v in "${vars[@]}"; do
            if [ -n "${!v}" ]; then
              eof="EOF_$(openssl rand -hex 8)"
              { echo "$v<<$eof"; printf '%s\n' "${!v}"; echo "$eof"; } >> "$GITHUB_ENV"
              echo "$v: set"
            else
              echo "$v: not set"
            fi
          done

      # Windows Authenticode: import a base64 .pfx into the user store and point tauri
      # at it with a --config overlay. Skipped (unsigned build) when the secret is empty.
      - name: Import Windows signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "WINDOWS_CERTIFICATE not set: building unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $conf = (Join-Path $env:RUNNER_TEMP "tauri.sign.json") -replace '\\', '/'
          @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = "sha256"
              timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8
          "args=--config $conf" >> $env:GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }} ${{ steps.wincert.outputs.args }}
          releaseId: ${{ needs.preflight.outputs.release_id }}

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-dist
          path: firmware/dist
      - name: Attach firmware images
        run: |
          shopt -s nullglob
          files=(firmware/dist/*.hex firmware/dist/*.bin firmware/dist/manifest.json)
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      # Publishing creates the tag on the released commit if it doesn't exist yet.
      - name: Publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -X PATCH \
            -F draft=false -f make_latest=true -q .html_url
