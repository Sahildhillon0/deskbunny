[package]
name = "deskbunny-flash"
description = "Pure-Rust Arduino flasher: Intel HEX, face blob patching, STK500v1/v2, AVR109, SAM-BA, DFU, ESP32 (espflash)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
serialport = "4"
nusb = "0.2"
log = "0.4"
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
