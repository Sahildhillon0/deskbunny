[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/deskbunny/deskbunny"
rust-version = "1.80"

[workspace.dependencies]
deskbunny-core = { path = "crates/deskbunny-core" }
deskbunny-flash = { path = "crates/deskbunny-flash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
